name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test-and-build:
    name: Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Start MongoDB test replica set (rs0 on 27018)
        run: |
          docker run -d --name mongo-ci-test -p 27018:27018 mongo:7.0 \
            --replSet rs0 --bind_ip_all --port 27018
          sleep 3
          docker exec mongo-ci-test mongosh --port 27018 --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27018" }] })'
          sleep 3
          docker exec mongo-ci-test mongosh --port 27018 --quiet --eval \
            'var t=0; while(rs.status().members[0].stateStr!=="PRIMARY"&&t++<20){sleep(500)}; print("PRIMARY elected")'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run Tests with Coverage
        env:
          NODE_ENV: test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27018/school_management_test?replicaSet=rs0
          JWT_SECRET: test-super-secret-jwt-key-min-32-chars-long
          COOKIE_SECRET: test-cookie-secret-key-min-32-chars
          PORT: 5001
        run: npm run test:coverage --workspace=apps/api

      - name: Build applications
        run: npm run build

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
